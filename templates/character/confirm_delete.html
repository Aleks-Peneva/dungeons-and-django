{% extends 'base.html' %}

{% block title %}Delete Player{% endblock %}

{% block content %}
<h1>Delete Player Character</h1>
<p>Are you sure you want to permanently remove <strong>"{{ object.name }}"</strong> and all their inventory items?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
    <a href="{% url 'character:detail' object.pk %}">Cancel</a>
</form>
{% endblock %}
