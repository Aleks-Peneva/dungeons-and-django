{% extends 'base.html' %}

{% block title %}{% if object %}Edit Item{% else %}Log New Item{% endif %}{% endblock %}

{% block content %}
<h1>{% if object %}Edit Item: {{ object.name }}{% else %}Log New Item{% endif %}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Item</button>
    <a href="{% url 'character:item-list' %}">Cancel</a>
</form>
{% endblock %}
