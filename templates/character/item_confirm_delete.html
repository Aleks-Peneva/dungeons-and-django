{% extends 'base.html' %}

{% block title %}Delete Item{% endblock %}

{% block content %}
<h1>Delete Item</h1>
<p>Are you sure you want to remove <strong>"{{ object.name }}"</strong> from {{ object.character.name }}'s inventory?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
    <a href="{% url 'character:detail' object.character.pk %}">Cancel</a>
</form>
{% endblock %}
