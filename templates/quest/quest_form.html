{% extends 'base.html' %}

{% block title %}{% if object %}Edit Quest{% else %}Post New Quest{% endif %}{% endblock %}

{% block content %}
<h1>{% if object %}Edit Quest: {{ object.title }}{% else %}Post New Quest{% endif %}</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save Quest</button>
    <a href="{% url 'quest:list' %}">Cancel</a>
</form>
{% endblock %}
