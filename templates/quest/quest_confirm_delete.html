{% extends 'base.html' %}

{% block title %}Confirm Removal | West Marches{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="guild-card p-4 p-md-5 text-center">
            <i class="bi bi-exclamation-triangle-fill display-4 mb-3" style="color: var(--blackberry-cream);"></i>
            <h2 class="fw-bold">Tear Down Quest Notice?</h2>
            <p class="lead mb-4">
                Are you certain you wish to permanently remove <strong>"{{ object.title }}"</strong> from the Tavern Quest Board?
            </p>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'quest:detail' object.pk %}" class="btn btn-outline-coffee px-4">Keep Notice</a>
                    <button type="submit" class="btn btn-blackberry px-4">
                        <i class="bi bi-fire me-1"></i>Confirm Deletion
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
